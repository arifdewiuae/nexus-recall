name: Evals

# RAG quality gate.
#   · PRs touching retrieval-affecting code or the ground-truth fixtures — a
#     chunking / context / embedding change "looks like a refactor" but can
#     silently move retrieval quality, so gate it (free, deterministic BM25).
#   · Every push to main — runs the FULL gate including the LLM-as-judge
#     faithfulness + answer-relevance metrics, using the API-key secret below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'evals/**'
      - 'src/routes/api/chat/chat.context.ts'
      - 'src/lib/rag/chunker.ts'
      - 'src/lib/rag/embeddings.ts'

permissions:
  contents: read

jobs:
  evals:
    name: RAG retrieval gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On main push the secrets are present → the full gate runs (BM25 recall@k /
      # MRR + LLM-judge faithfulness + embedding-based answer similarity & relevance),
      # failing if recall@3 < 0.8, faithfulness < 0.8, answer similarity < 0.8, or
      # answer relevance < 0.65. ANTHROPIC_API_KEY drives the judge + question
      # regeneration; OPENAI_API_KEY drives the embeddings (text-embedding-3-small)
      # the similarity/relevance metrics are calibrated against.
      # On PRs (and forks) the secrets are absent → free, deterministic retrieval
      # metrics only. `pnpm run eval` skips the generation metrics without a key.
      - name: Run evals (RAG quality gate)
        run: pnpm run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
