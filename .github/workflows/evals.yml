name: Evals

# RAG quality gate. Runs on PRs that touch retrieval-affecting code or the
# ground-truth fixtures — a chunking / context / embedding change "looks like a
# refactor" but can silently move retrieval quality, so gate it.
on:
  pull_request:
    branches: [main]
    paths:
      - 'evals/**'
      - 'src/routes/api/chat/chat.context.ts'
      - 'src/lib/rag/chunker.ts'
      - 'src/lib/rag/embeddings.ts'

permissions:
  contents: read

jobs:
  evals:
    name: RAG retrieval gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No API key in CI → retrieval metrics only (BM25 recall@k / MRR), which
      # are free and deterministic. The faithfulness LLM-judge runs locally /
      # pre-merge where a key is available. `pnpm run eval` exits non-zero if
      # recall@3 < 0.8.
      - name: Run evals (retrieval gate)
        run: pnpm run eval
