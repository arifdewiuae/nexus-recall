name: Evals

# RAG quality gate.
#   · PRs touching retrieval-affecting code or the ground-truth fixtures — a
#     chunking / context / embedding change "looks like a refactor" but can
#     silently move retrieval quality, so gate it (free, deterministic BM25).
#   · Every push to main — runs the retrieval gate against the production
#     vector + cross-encoder path (key-free local models). The LLM-as-judge
#     faithfulness / answer-relevance metrics ALSO gate here, but only when the
#     optional API-key secrets below are configured. They are unset by default,
#     so in CI those metrics are skipped and stay a local `pnpm eval` step (see
#     README) — add the secrets to turn the LLM gate on in CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'evals/**'
      - 'src/routes/api/chat/chat.context.ts'
      - 'src/lib/rag/chunker.ts'
      - 'src/lib/rag/embeddings.ts'

permissions:
  contents: read

jobs:
  evals:
    name: RAG retrieval gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On main push: EVAL_VECTOR=1 runs the production retrieval path (MiniLM
      # cosine + cross-encoder rerank, downloaded from the HF CDN, no key needed)
      # alongside BM25, and gates on BM25 recall@3 < 0.8 and vector+rerank
      # recall@3 < 0.8 — all key-free.
      #
      # The LLM-judge metrics (faithfulness < 0.8, answer similarity < 0.8,
      # answer relevance < 0.65) also gate, but only when the optional secrets
      # below are set: ANTHROPIC_API_KEY drives the judge + question
      # regeneration, OPENAI_API_KEY the embeddings (text-embedding-3-small).
      # By default they are unset, so the eval prints "Generation metrics
      # skipped" and those metrics are exercised locally via `pnpm eval` with
      # keys (a few cents/run) instead of as a per-merge CI gate.
      #
      # On PRs (and forks): EVAL_VECTOR=0 and the secrets are absent → free,
      # deterministic BM25 retrieval gate only (no model downloads, no LLM calls).
      - name: Run evals (RAG quality gate)
        run: pnpm run eval
        env:
          EVAL_VECTOR: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
